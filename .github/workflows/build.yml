name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach installers to a GitHub Release on v* tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # npm may skip dependency install scripts; make sure the Electron binary is present.
      - run: node node_modules/electron/install.js

      - name: Build offline web bundle (fetch upstream, patch, build)
        run: npm run build:web

      - name: Smoke test (page loads with no network, WebHID chooser wired up)
        run: npm run smoke

      - name: Package
        run: npx electron-builder --publish never

      # The step above tests the source tree; these test what is actually shipped.
      - name: Smoke test the packaged app
        run: npm run smoke:packaged

      - name: Verify the .dmg itself (mount, copy out, check signature, launch)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(ls release/*.dmg | head -n 1)"
          MNT="$(mktemp -d)"
          DEST="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          APP="$(ls -d "$MNT"/*.app | head -n 1)"
          cp -R "$APP" "$DEST/"
          hdiutil detach "$MNT" -quiet || hdiutil detach "$MNT" -force -quiet
          COPY="$DEST/$(basename "$APP")"
          echo "--- architectures:"; lipo -archs "$COPY/Contents/MacOS/"* || true
          echo "--- signature:"; codesign -dv "$COPY" 2>&1 || true
          codesign --verify --deep --strict --verbose=2 "$COPY"
          node scripts/smoke-packaged.mjs "$COPY"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output-${{ matrix.os }}
          path: |
            smoke-output/
            smoke-packaged/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
